# Render blueprint — backend API + managed PostgreSQL.
# Create it once via Render Dashboard → New → Blueprint (point it at this repo).
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: realtime-bid-db
    databaseName: realtime_bid
    user: realtime_bid
    plan: free # free Postgres expires after ~90 days — upgrade for anything real

services:
  - type: web
    name: realtime-bid-api
    runtime: docker
    plan: free # free web services sleep after 15 min idle; first request cold-starts
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Deploys are triggered by the GitHub Actions deploy hook (after CI passes),
    # not by Render's own git watcher — so a red pipeline never ships.
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; the app already reads process.env.PORT.
      - key: DATABASE_URL
        fromDatabase:
          name: realtime-bid-db
          property: connectionString
      # Strong random secrets, generated once by Render and kept stable. The two
      # generate independently so they differ (env.ts requires access != refresh).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      # Must be the exact Vercel URL (no trailing slash, no "*") — production
      # env validation rejects a wildcard. Set this in the dashboard after the
      # frontend has a URL. Comma-separate to allow more than one origin.
      - key: CORS_ORIGIN
        sync: false
