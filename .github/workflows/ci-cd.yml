name: CI/CD

# CI runs on every push and PR. CD (image build/push) only runs on push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI — backend: typecheck, build, and run the verify-*.ts scripts against a
  # real Postgres instance (integration tests).
  # ---------------------------------------------------------------------------
  verify:
    name: Verify backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realtime_bid_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before steps run.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realtime_bid_test?schema=public
      # Throwaway CI secrets — must differ from each other and not be placeholders
      # (see src/config/env.ts). Never reuse these anywhere real.
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production-9876543210
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: "*"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run verification scripts
        run: npm run verify

  # ---------------------------------------------------------------------------
  # CI — frontend: make sure the Nuxt app builds.
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # CD — trigger the platform deploys, but only on push to main and only after
  # both CI jobs pass. Render builds the backend image from ./Dockerfile and
  # Vercel builds the Nuxt frontend; we just fire their deploy hooks here so a
  # deploy never happens unless the verify + build jobs are green.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [verify, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger backend deploy (Render)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping backend deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "Render deploy triggered."

      - name: Trigger frontend deploy (Vercel)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set — skipping frontend deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "Vercel deploy triggered."
